name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Build web assets
      working-directory: web
      run: |
        npm ci
        npm run build
    
    - name: Create dist directory
      run: mkdir -p dist
    
    - name: Build Linux binaries
      env:
        GOOS: linux
        GOARCH: amd64
      run: |
        go build -o dist/server-linux ./cmd/server
        go build -o dist/agent-linux ./cmd/agent
    
    - name: Build Windows binaries
      env:
        GOOS: windows
        GOARCH: amd64
      run: |
        go build -o dist/server-windows.exe ./cmd/server
        go build -o dist/agent-windows.exe ./cmd/agent
    
    - name: Build macOS binaries (Intel)
      env:
        GOOS: darwin
        GOARCH: amd64
      run: |
        go build -o dist/server-darwin-amd64 ./cmd/server
        go build -o dist/agent-darwin-amd64 ./cmd/agent
    
    - name: Build macOS binaries (ARM)
      env:
        GOOS: darwin
        GOARCH: arm64
      run: |
        go build -o dist/server-darwin-arm64 ./cmd/server
        go build -o dist/agent-darwin-arm64 ./cmd/agent
    
    - name: Calculate checksums
      run: |
        cd dist
        if command -v sha256sum &> /dev/null; then
          sha256sum * > SHA256SUMS
        else
          shasum -a 256 * > SHA256SUMS
        fi
    
    - name: Get version
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    
    - name: Create Release
      uses: actions/create-release@v1
      id: create_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        release_name: Release ${{ steps.version.outputs.VERSION }}
        body: |
          ## GoMeshCentral ${{ steps.version.outputs.VERSION }}
          
          Cross-platform binaries for Linux, Windows, and macOS.
          
          **Server binaries:**
          - `server-linux` - Linux x86_64
          - `server-windows.exe` - Windows
          - `server-darwin-amd64` - macOS Intel
          - `server-darwin-arm64` - macOS Apple Silicon
          
          **Agent binaries:**
          - `agent-linux` - Linux x86_64
          - `agent-windows.exe` - Windows
          - `agent-darwin-amd64` - macOS Intel
          - `agent-darwin-arm64` - macOS Apple Silicon
          
          **Installation:**
          1. Download the appropriate binary for your platform
          2. Make it executable: `chmod +x server-linux agent-linux` (Linux/macOS)
          3. Set environment variables (see docs/DEPLOYMENT.md)
          4. Run: `./server-linux` and `./agent-linux`
          
          **Verify checksums:**
          ```
          sha256sum -c SHA256SUMS
          ```
        draft: false
        prerelease: false
    
    - name: Upload Linux server
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/server-linux
        asset_name: server-linux
        asset_content_type: application/octet-stream
    
    - name: Upload Linux agent
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/agent-linux
        asset_name: agent-linux
        asset_content_type: application/octet-stream
    
    - name: Upload Windows server
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/server-windows.exe
        asset_name: server-windows.exe
        asset_content_type: application/octet-stream
    
    - name: Upload Windows agent
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/agent-windows.exe
        asset_name: agent-windows.exe
        asset_content_type: application/octet-stream
    
    - name: Upload macOS server (amd64)
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/server-darwin-amd64
        asset_name: server-darwin-amd64
        asset_content_type: application/octet-stream
    
    - name: Upload macOS server (arm64)
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/server-darwin-arm64
        asset_name: server-darwin-arm64
        asset_content_type: application/octet-stream
    
    - name: Upload macOS agent (amd64)
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/agent-darwin-amd64
        asset_name: agent-darwin-amd64
        asset_content_type: application/octet-stream
    
    - name: Upload macOS agent (arm64)
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/agent-darwin-arm64
        asset_name: agent-darwin-arm64
        asset_content_type: application/octet-stream
    
    - name: Upload checksums
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/SHA256SUMS
        asset_name: SHA256SUMS
        asset_content_type: text/plain
